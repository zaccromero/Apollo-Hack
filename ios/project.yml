name: ApolloHack
options:
  bundleIdPrefix: com.zaccromero
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Staging: release
  Release: release
  Production: release
settings:
  configs:
    Debug:
      APOLLO_ENVIRONMENT: dev
    Staging:
      APOLLO_ENVIRONMENT: staging
    Release:
      APOLLO_ENVIRONMENT: staging
    Production:
      APOLLO_ENVIRONMENT: prod
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  ApolloHack:
    type: application
    platform: iOS
    info:
      path: ApolloHack/Info.plist
      properties:
        ApolloEnvironment: $(APOLLO_ENVIRONMENT)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    sources:
      - path: ApolloHack
        excludes: ["OnboardingSettings/Tests/**"]
      - path: ../config/environments/ApolloEnvironmentPolicy.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.zaccromero.ApolloHack
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ApolloEnvironment: $(APOLLO_ENVIRONMENT)
        INFOPLIST_KEY_CFBundleDisplayName: Apollo Hack
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ApolloHackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ApolloHackUITests]
    dependencies:
      - target: ApolloHack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApolloHack:
    build:
      targets:
        ApolloHack: all
        ApolloHackUITests: [test]
    test:
      targets: [ApolloHackUITests]
